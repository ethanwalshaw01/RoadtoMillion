<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road to Million</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #f6d365, #fda085);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.subtitle {
      font-size: 1.15rem;
      color: #cfd8dc;
      max-width: 500px;
      margin: 0 auto 32px;
    }

    .cta {
      display: inline-block;
      padding: 14px 32px;
      background: #f6d365;
      color: #0f2027;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(246, 211, 101, 0.35);
    }

    footer {
      margin-top: 48px;
      font-size: 0.85rem;
      color: #90a4ae;
    }
  </style>
</head>
<body>
  <header>
    <h1>Road to Million</h1>
    <p class="subtitle">
      Tracking the journey to a million, one milestone at a time. Follow along as we build,
      save, invest, and grow toward the goal.
    </p>
    <a class="cta" href="#">Get Started</a>
  </header>
  <footer>
    &copy; 2026 Road to Million. All rights reserved.
  </footer>
</body>
</html>
